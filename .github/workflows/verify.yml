name: verify-publication-artifacts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paper-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify paper evidence
        run: python scripts/verify_paper_evidence.py
      - name: Reproduce tables
        run: python scripts/reproduce_tables.py
      - name: Install plotting dependency
        run: python -m pip install -r requirements-paper.txt
      - name: Reproduce figures
        run: python scripts/reproduce_figures.py
